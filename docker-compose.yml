version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: campus-connect-db
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: campus_connect
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-connect-api
    ports:
      - "8000:8000"
    environment:
      MONGO_URL: mongodb://mongodb:27017
      DB_NAME: campus_connect
      SECRET_KEY: change-this-in-production
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    depends_on:
      - mongodb
    command: python server.py

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus-connect-web
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  mongodb_data:

networks:
  default:
    name: campus-connect-network
