# Campus Connect — Render Web Service (reuse existing service URL)
# After merge: in Render dashboard, point your current service at this repo
# and use the build/start commands below (or Blueprint).

services:
  - type: web
    name: campus-connect
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npx serve -s dist -l tcp://0.0.0.0:$PORT
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
